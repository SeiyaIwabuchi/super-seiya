        - generic [ref=e38]: 👨‍🍳
        - generic [ref=e39]:
          - paragraph [ref=e40]: 「おいしいものは、素材が9割」これが店主の口癖です。どんなに調理の腕がよくても、素材が良くなければ美味しい料理はできない。だからこそ、仕入れには誰よりも時間をかけています。
          - paragraph [ref=e41]: 毎朝4時には仕入れ先を巡り、その日の最も状態の良い食材だけを選び抜きます。鮮魚は目の輝き・エラの色・身の弾力を一つひとつ確認。野菜は農家さんの顔を思い浮かべながら手に取ります。
          - paragraph [ref=e42]: 「値段が少し高くても、本当に良いものを届けたい。それが長く続けてきたせい屋の約束です」
