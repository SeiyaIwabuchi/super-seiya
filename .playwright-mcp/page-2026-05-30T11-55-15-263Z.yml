      - generic [ref=e23]:
        - generic [ref=e25]: 🏪
        - generic [ref=e26]:
          - paragraph [ref=e27]: スーパーせい屋は、今から30年以上前に一関市の中心部に産声を上げました。創業者である現店主の父が「地元の人たちに、新鮮で安全な食材を届けたい」という思いで小さな青果店として始めたのがルーツです。
          - paragraph [ref=e28]: 少しずつ品揃えを広げ、今では野菜・鮮魚・精肉・お惣菜・地元産品と幅広く取り扱うようになりました。時代が変わっても変わらないのは、「顔の見える関係」を大切にするという創業当時からの精神です。
          - paragraph [ref=e29]: 現在は2代目店主が父から受け継いだ想いを胸に、毎朝早くから仕入れに向かっています。地域の皆さんに「今日もせい屋で買ってよかった」と思っていただけるよう、日々精進しています。
    - generic [ref=e31]:
