      - generic [ref=e20]:
        - generic [ref=e22]: 🏪
        - generic [ref=e23]:
          - paragraph [ref=e24]: スーパーせい屋は、今から30年以上前に一関市の中心部に産声を上げました。創業者である現店主の父が「地元の人たちに、新鮮で安全な食材を届けたい」という思いで小さな青果店として始めたのがルーツです。
          - paragraph [ref=e25]: 少しずつ品揃えを広げ、今では野菜・鮮魚・精肉・お惣菜・地元産品と幅広く取り扱うようになりました。時代が変わっても変わらないのは、「顔の見える関係」を大切にするという創業当時からの精神です。
          - paragraph [ref=e26]: 現在は2代目店主が父から受け継いだ想いを胸に、毎朝早くから仕入れに向かっています。地域の皆さんに「今日もせい屋で買ってよかった」と思っていただけるよう、日々精進しています。
    - generic [ref=e28]:
      - paragraph [ref=e29]: OUR COMMITMENT
      - heading "店主のこだわり" [level=2] [ref=e30]
      - generic [ref=e31]:
        - generic [ref=e33]: 👨‍🍳
        - generic [ref=e34]:
          - paragraph [ref=e35]: 「おいしいものは、素材が9割」これが店主の口癖です。どんなに調理の腕がよくても、素材が良くなければ美味しい料理はできない。だからこそ、仕入れには誰よりも時間をかけています。
          - paragraph [ref=e36]: 毎朝4時には仕入れ先を巡り、その日の最も状態の良い食材だけを選び抜きます。鮮魚は目の輝き・エラの色・身の弾力を一つひとつ確認。野菜は農家さんの顔を思い浮かべながら手に取ります。
          - paragraph [ref=e37]: 「値段が少し高くても、本当に良いものを届けたい。それが長く続けてきたせい屋の約束です」
          - paragraph [ref=e38]: — 店主 〇〇 〇〇
